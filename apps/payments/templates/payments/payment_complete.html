<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Complete</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      text-align: center;
    }
    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #1a8a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      animation: pop 0.4s ease-out;
    }
    @keyframes pop {
      0%   { transform: scale(0); }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
    }
    p {
      color: #a0a0b8;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .hint {
      font-size: 13px;
      color: #6a6a82;
      margin-top: 16px;
    }
    button {
      background: #C9961A;
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Payment Received</h1>
    <p>Your balance will update in a moment. Returning you to the app…</p>
    <button onclick="closeWindow()">Return to App</button>
    <p class="hint">If this tab doesn't close automatically, tap the button above.</p>
  </div>

  <script>
    function closeWindow() {
      // Try Telegram WebApp close first (works inside Telegram in-app browser)
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          window.Telegram.WebApp.close();
          return;
        } catch (e) {}
      }
      // Fallback: standard window close
      window.close();
      // If neither worked, navigate back
      setTimeout(() => {
        if (!document.hidden) {
          window.history.back();
        }
      }, 500);
    }

    // Auto-close after 2 seconds
    setTimeout(closeWindow, 2000);
  </script>
</body>
</html>
